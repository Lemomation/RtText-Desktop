<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="beadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <radialGradient id="beadDepth" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <!-- Base gradient orb -->
  <circle cx="50" cy="50" r="48" fill="url(#beadGrad)"/>
  <!-- 3D spherical depth overlay -->
  <circle cx="50" cy="50" r="48" fill="url(#beadDepth)"/>
  <!-- Specular gloss highlight -->
  <circle cx="32" cy="30" r="9" fill="#FFFFFF" fill-opacity="0.88"/>
  <circle cx="28" cy="26" r="3.5" fill="#FFFFFF" fill-opacity="0.95"/>
</svg>
